   (moonlit navy). Every page sits on a sky backdrop; each section has its own

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
}

html {
  -webkit-tap-highlight-color: transparent;
}
/* Tapping or long-pressing a control shouldn't select its label like copied text. */
button,
[role='button'],
.tabbar,
.topbar,
.nav__item {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1,
h2,
h3 {
  text-wrap: balance;
  font-weight: 600;
  letter-spacing: -0.015em;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

::selection {
  background: var(--accent-soft);
  color: var(--text);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.num {
  font-variant-numeric: tabular-nums;
}

.muted {
  color: var(--text-2);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}
/* Each page paints its buttons, checkboxes, progress and focus rings in its
   own colour: --accent* inside <main> point at the page's --section*. */
main[data-section='home'] {
  --section: var(--c-tasks);
  --section-soft: var(--c-tasks-soft);
  --section-text: var(--c-tasks-text);
  --on-section: var(--c-tasks-on);
}
main[data-section='tasks'] {
  --section: var(--c-tasks);
  --section-soft: var(--c-tasks-soft);
  --section-text: var(--c-tasks-text);
  --on-section: var(--c-tasks-on);
}

  --section: var(--c-websites);
  --section-soft: var(--c-websites-soft);
  --section-text: var(--c-websites-text);
  --on-section: var(--c-websites-on);
}
main[data-section='ideas'] {

  --section-soft: var(--c-ideas-soft);

}
main[data-section='saved'] {

  --section-soft: var(--c-saved-soft);

  --on-section: var(--c-saved-on);
}
main[data-section='preferences'] {

  --section-soft: var(--c-preferences-soft);

}
main[data-section='goals'] {

  --section-soft: var(--c-goals-soft);

}
main[data-section='knowledge'] {
  --section: var(--c-knowledge);
  --section-soft: var(--c-knowledge-soft);
  --section-text: var(--c-knowledge-text);
  --on-section: var(--c-knowledge-on);
}
main[data-section] {
  --accent: var(--section);
  --accent-hover: color-mix(in srgb, var(--section) 86%, #000);
  --accent-soft: var(--section-soft);
  --accent-text: var(--section-text);
  --on-accent: var(--on-section);
}
/* Every page except Home sits on a still sky with clouds and a strip of
   meadow along the bottom. Home has the live meadow instead. */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
}
.backdrop__cloud {
  position: absolute;
  color: var(--cloud);
  filter: blur(1px);
}
.backdrop__cloud--1 { top: 9%; left: -4%; width: 300px; }
.backdrop__cloud--2 { top: 22%; right: -6%; width: 380px; }
.backdrop__cloud--3 { top: 48%; left: 38%; width: 220px; opacity: 0.7; }
.backdrop__stars {
  position: absolute;
  inset: 0 0 30% 0;
}
.backdrop__star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.6);
  animation: twinkle 3.2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 1; }
}
.backdrop__grass {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 120px;
}
.backdrop__grass path:first-child { fill: var(--grass-1); }
.backdrop__grass path:last-child { fill: var(--grass-2); }
.app {
  position: relative;
  z-index: 1;
}

/* Rounded display type for headings, like the "touch grass" title. */
.page-title,
.panel__title,
.settings__title,
.modal__title {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0;
}
/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 36px;
  padding: 0 14px;
  border-radius: var(--r-md);
  font-size: var(--fs-md);
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease),
    box-shadow var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  user-select: none;
}
.btn:active:not(:disabled) {
  transform: scale(0.97);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn svg {
  flex: none;
}
.btn--sm {
  height: 30px;
  padding: 0 10px;
  font-size: var(--fs-sm);
  border-radius: var(--r-sm);
  gap: 6px;
}
.btn--primary {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, var(--shadow-sm);
}
.btn--primary:hover:not(:disabled) {
  background: var(--accent-hover);
}
.btn--secondary {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.btn--secondary:hover:not(:disabled) {
  background: var(--surface-2);
}
.btn--ghost {
  color: var(--text-2);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--surface-2);
  color: var(--text);
}
.btn--danger {
  background: var(--danger);
  color: #fff;
}
.btn--danger:hover:not(:disabled) {
  filter: brightness(1.06);
}
.btn--danger-ghost {
  color: var(--danger);
}
.btn--danger-ghost:hover:not(:disabled) {
  background: var(--danger-soft);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  color: var(--text-2);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  flex: none;
}
.icon-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}
.icon-btn:active {
  transform: scale(0.94);
}
.icon-btn--sm {
  width: 28px;
  height: 28px;
}

.text-link {
  color: var(--accent-text);
  font-weight: 500;
  font-size: var(--fs-sm);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--r-sm);
}
.text-link:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.kbd {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1;
}

/* ---------- Form fields ---------- */
.field {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.field__label {
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--text);
}
.field__hint {
  font-size: var(--fs-xs);
  color: var(--text-2);
}
.field__error {
  font-size: var(--fs-xs);
  color: var(--danger);
  display: flex;
  align-items: center;
  gap: 5px;
}
.input,
.textarea,
.select {
  width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 11px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: var(--fs-md);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.textarea {
  height: auto;
  min-height: 96px;
  padding: 9px 11px;
  resize: vertical;
  line-height: 1.55;
}
.input::placeholder,
.textarea::placeholder {
  color: var(--text-3);
}
.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input[aria-invalid='true'] {
  border-color: var(--danger);
}
.input[aria-invalid='true']:focus {
  box-shadow: 0 0 0 3px var(--danger-soft);
}
.select {
  appearance: none;
  padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
    linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}
.form {
  display: grid;
  gap: 16px;
}
.check-row {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: var(--fs-md);
  cursor: pointer;
}
.check-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

/* Segmented control */
.segmented {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  background: var(--surface-2);
  border-radius: var(--r-md);
  max-width: 100%;
  overflow-x: auto;
}
.segmented button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: 7px;
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.segmented button:hover {
  color: var(--text);
}
.segmented button[aria-pressed='true'],
.segmented button[aria-selected='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.segmented .count {
  font-size: var(--fs-xs);
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ---------- Badges ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--surface-2);
  color: var(--text-2);
  white-space: nowrap;
}
.badge--sample {
  background: transparent;
  border: 1px dashed var(--border-strong);
  color: var(--text-3);
  height: 18px;
  padding: 0 5px;
  font-size: 10.5px;
  letter-spacing: 0.02em;
}
.badge--accent {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.badge--danger {
  background: var(--danger-soft);
  color: var(--danger);
}
.badge--warn {
  background: var(--warn-soft);
  color: var(--warn);
}

/* ---------- Modal ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--overlay);
  display: grid;
  place-items: start center;
  padding: 12vh 16px 16px;
  animation: fade-in var(--t-fast) var(--ease);
}
.modal {
  width: 100%;
  max-width: 480px;
  max-height: 76vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  animation: pop-in var(--t-med) var(--ease);
  overflow: hidden;
}
.modal--wide {
  max-width: 600px;
}
.modal__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px 4px 20px;
}
.modal__title {
  font-size: var(--fs-lg);
  font-weight: 600;
}
.modal__body {
  padding: 12px 20px 20px;
  overflow-y: auto;
}
.modal__desc {
  color: var(--text-2);
  font-size: var(--fs-md);
}
.modal__foot {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.modal__foot .spacer {
  flex: 1;
}

@media (max-width: 640px) {
  .overlay {
    place-items: end stretch;
    padding: 0;
  }
  .modal {
    max-width: none;
    max-height: 88vh;
    border-radius: 16px 16px 0 0;
    border-bottom: 0;
    animation: sheet-in var(--t-med) var(--ease);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .modal__foot {
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .modal__foot .btn {
    flex: 1;
    height: 42px;
  }
  .modal__foot .spacer {
    display: none;
  }
}

/* ---------- Toasts ---------- */
.toasts {
  position: fixed;
  z-index: 70;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  width: min(420px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 14px;
  border-radius: var(--r-md);
  background: var(--text);
  color: var(--bg);
  box-shadow: var(--shadow-lg);
  font-size: var(--fs-md);
  animation: toast-in var(--t-med) var(--ease);
}
.toast[data-leaving='true'] {
  animation: toast-out var(--t-fast) var(--ease) forwards;
}
.toast__icon {
  flex: none;
  display: grid;
  place-items: center;
}
.toast__icon--success {
  color: #6fdc9a;
}
.toast__icon--error {
  color: #ff9b9b;
}
.toast__msg {
  flex: 1;
  min-width: 0;
}
.toast__action {
  flex: none;
  height: 28px;
  padding: 0 10px;
  border-radius: var(--r-sm);
  font-weight: 600;
  font-size: var(--fs-sm);
  color: var(--bg);
  background: color-mix(in srgb, var(--bg) 16%, transparent);
}
.toast__action:hover {
  background: color-mix(in srgb, var(--bg) 26%, transparent);
}
.toast__close {
  color: color-mix(in srgb, var(--bg) 70%, transparent);
}
.toast__close:hover {
  background: color-mix(in srgb, var(--bg) 14%, transparent);
  color: var(--bg);
}

/* ---------- Menu ---------- */
.menu-wrap {
  position: relative;
  display: inline-flex;
}
.menu {
  position: absolute;
  z-index: 40;
  top: calc(100% + 4px);
  right: 0;
  min-width: 168px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  animation: pop-in var(--t-fast) var(--ease);
}
.menu--up {
  top: auto;
  bottom: calc(100% + 4px);
}
.menu__item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 32px;
  padding: 0 9px;
  border-radius: var(--r-sm);
  font-size: var(--fs-md);
  text-align: left;
  color: var(--text);
}
.menu__item svg {
  color: var(--text-2);
}
.menu__item:hover,
.menu__item:focus-visible {
  background: var(--surface-2);
  outline: none;
}
.menu__item--danger,
.menu__item--danger svg {
  color: var(--danger);
}
.menu__item--danger:hover,
.menu__item--danger:focus-visible {
  background: var(--danger-soft);
}
.menu__sep {
  height: 1px;
  background: var(--border);
  margin: 4px 2px;
}

/* ---------- Empty state ---------- */
.empty {
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 6px;
  padding: 40px 20px;
}
.empty--compact {
  padding: 22px 16px;
}
.empty__icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-text);
  margin-bottom: 6px;
}
.empty__title {
  font-size: var(--fs-lg);
  font-weight: 600;
}
.empty__body {
  color: var(--text-2);
  max-width: 36ch;
  font-size: var(--fs-md);
}
.empty__action {
  margin-top: 10px;
}

/* ---------- Progress ---------- */
.ring {
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
}
.ring svg {
  transform: rotate(-90deg);
}
.ring__track {
  stroke: var(--surface-3);
}
.ring__value {
  stroke: var(--accent);
  transition: stroke-dashoffset 500ms var(--ease), stroke var(--t-med) var(--ease);
}
.ring--complete .ring__value {
  stroke: var(--success);
}
.ring__label {
  position: absolute;
  font-size: var(--fs-sm);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.bar {
  height: 6px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}

/* ---------- Checkbox (task) ---------- */
.tcheck {
  position: relative;
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  display: grid;
  place-items: center;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.tcheck:hover {
  border-color: var(--accent);
}
.tcheck--prio-high {
  border-color: color-mix(in srgb, var(--danger) 60%, var(--border-strong));
}
.tcheck svg {
  color: var(--on-accent);
  stroke-dasharray: 26;
  stroke-dashoffset: 26;
}
.tcheck[aria-checked='true'] {
  background: var(--accent);
  border-color: var(--accent);
}
.tcheck.is-popping {
  animation: check-pop 260ms var(--ease);
}
.tcheck.is-popping::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 9px;
  border: 2px solid var(--accent);
  animation: check-ring 420ms var(--ease) forwards;
  pointer-events: none;
}

/* ---------- Monogram (shortcut / saved favicon stand-in) ---------- */
.mono {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  background: hsl(var(--h) 60% var(--tile-l));
  color: hsl(var(--h) 45% var(--tile-text-l));
  user-select: none;
}
.mono--lg {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  font-size: 18px;
}
.mono--sm {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  font-size: 11px;
}

/* ---------- Animations ---------- */
@keyframes fade-in {
  from {
    opacity: 0;
  }
}
@keyframes pop-in {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.98);
  }
}
@keyframes sheet-in {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
}
@keyframes toast-out {
  to {
    opacity: 0;
    transform: translateY(6px);
  }
}
@keyframes check-pop {
  40% {
    transform: scale(1.18);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes check-ring {
  from {
    opacity: 0.55;
    transform: scale(0.8);
  }
  to {
    opacity: 0;
    transform: scale(1.5);
  }
}
@keyframes page-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
}
@keyframes row-in {
  from {
    opacity: 0;
    transform: translateY(-3px);
  }
}
@keyframes flash {
  0% {
    background: var(--accent-soft);
  }
  100% {
    background: transparent;
  }
}
/* Frosted surfaces that float over the sky and the meadow: the dock, the
   corner cluster, the brand pill, the time-of-day switch, the break pill. */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass {
    background: color-mix(in srgb, var(--surface) 92%, transparent);
  }
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  border-radius: var(--r-sm);
}
.brand__mark {
  flex: none;
}
.brand__word {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.16em;
}

/* ---------- Page bar ---------- */
.pagebar {
  position: fixed;
  z-index: 30;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
  transition: opacity 600ms var(--ease), transform 600ms var(--ease);
}
.pagebar > * {
  pointer-events: auto;
}
.pagebar[data-hidden='true'] {
  opacity: 0;
  transform: translateY(-12px);
  pointer-events: none;
}
.pagebar[data-hidden='true'] > * {
  pointer-events: none;
}
.pagebar__brand {
  height: 44px;
  padding: 0 14px 0 11px;
  border-radius: 999px;
}
.pagebar__where {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--text-2);
  padding-left: 9px;
  border-left: 1px solid var(--border-strong);
}

/* ---------- Corner cluster ---------- */
.cluster {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
}
.cluster .icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  color: var(--text);
}
.cluster .icon-btn:hover {
  background: color-mix(in srgb, var(--surface) 55%, transparent);
}
.cluster .icon-btn[aria-current='page'] {
  background: var(--surface);
}

/* ---------- Glass dock ---------- */
.app {
  min-height: 100%;
}
.dock {
  --dock-h: 64px;
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border-radius: 999px;
  max-width: calc(100vw - 24px);
  transition: transform 600ms var(--ease), opacity 600ms var(--ease);
}
.dock[data-hidden='true'] {
  transform: translate(-50%, calc(100% + 40px));
  opacity: 0;
}
.dock__tab {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 48px;
  height: 52px;
  padding: 0 16px;
  border-radius: 999px;
  color: var(--text-2);
  font-weight: 600;
  font-size: var(--fs-md);
  transition: color var(--t-fast) var(--ease);
}
.dock__tab:hover {
  color: var(--text);
}
.dock__tab[aria-current='page'] {
  color: var(--accent-text);
}
.dock__tab:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: -2px;
  border-radius: 999px;
}
.dock__icon {
  position: relative;
  display: grid;
  place-items: center;
}
.dock__badge {
  position: absolute;
  top: -7px;
  right: -10px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--c-saved);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  line-height: 17px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.dock__pebble {
  position: absolute;
  z-index: 0;
  top: 6px;
  bottom: 6px;
  left: 0;
  width: var(--pebble-w);
  transform: translateX(var(--pebble-x));
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
  transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), width 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
@media (max-width: 760px) {
  .dock {
    left: 12px;
    right: 12px;
    transform: none;
    justify-content: space-between;
    padding: 5px;
  }
  .dock[data-hidden='true'] {
    transform: translateY(calc(100% + 40px));
  }
  .dock__tab {
    flex: 1;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 44px;
    height: 54px;
    padding: 0 4px;
    font-size: 10.5px;
  }
  .dock__pebble {
    top: 5px;
    bottom: 5px;
  }
}

/* ---------- Page frame ---------- */
.page {
  --dock-space: calc(64px + 16px + 24px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: calc(var(--content-max) + 56px);
  margin: 0 auto;
  padding-top: calc(84px + env(safe-area-inset-top, 0px));
  padding-bottom: var(--dock-space);
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
  animation: page-in var(--t-med) var(--ease);
}
.app[data-route='home'] .storage-alert {
  position: fixed;
  z-index: 31;
  top: calc(68px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px));
}
.app[data-route='home'] .page {
  max-width: none;
  min-height: 100dvh;
  padding: 0;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.page-head__text {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.page-title {
  font-size: var(--fs-3xl);
  line-height: 1.15;
  letter-spacing: -0.025em;
}
.page-desc {
  color: var(--text-2);
  font-size: var(--fs-lg);
}
.eyebrow {
  font-size: var(--fs-sm);
  color: var(--text-2);
  font-weight: 500;
}

.storage-alert {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 auto 16px;
  padding: 10px 14px;
  border-radius: var(--r-md);
  background: var(--warn-soft);
  color: var(--warn);
  font-size: var(--fs-sm);
  font-weight: 500;
}

@media (max-width: 760px) {
  .page {
    padding-top: calc(72px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page-title {
    font-size: var(--fs-2xl);
  }
  .page-head {
    margin-bottom: 18px;
    align-items: flex-start;
  }
  .page-head .btn--primary {
    display: none; /* the corner cluster's capture button and in-page add rows cover this */
  }
  .page-head .btn--primary.keep-mobile {
    display: inline-flex;
  }
}
/* ---------- Shared page pieces ---------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  min-width: 0;
}
.panel--flush {
  padding: 6px 0;
}
.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.panel__title {
  font-size: var(--fs-xl);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.panel__title--small {
  font-size: var(--fs-md);
  font-weight: 600;
  margin-bottom: 8px;
}
.panel__sub {
  color: var(--text-2);
  font-size: var(--fs-sm);
  margin-top: 1px;
}
.panel__foot {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.panel__empty {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-2);
  font-size: var(--fs-sm);
  padding: 6px 0;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  min-width: 0;
}
.page-head__actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  border-radius: 99px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.chip:hover {
  color: var(--text);
  background: var(--surface-2);
}
.chip[aria-pressed='true'] {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent-text);
}
.date-quick,
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.range {
  --val: 0%;
  width: 100%;
  height: 24px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
.range::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 99px;
  background: linear-gradient(to right, var(--accent) var(--val), var(--surface-3) var(--val));
}
.range::-moz-range-track {
  height: 6px;
  border-radius: 99px;
  background: linear-gradient(to right, var(--accent) var(--val), var(--surface-3) var(--val));
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
  box-shadow: var(--shadow-sm);
  transition: transform var(--t-fast) var(--ease);
}
.range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
}
.range:active::-webkit-slider-thumb {
  transform: scale(1.15);
}
.range:focus-visible {
  outline: none;
}
.range:focus-visible::-webkit-slider-thumb {
  box-shadow: 0 0 0 4px var(--accent-soft);
}

/* ---------- Home meadow ---------- */
.meadow-sound {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: var(--text-2);
  border: 1px solid var(--glass-border);
}
.meadow-sound[aria-pressed='true'] {
  background: var(--surface);
  color: var(--text);
}
.meadow-time__opt:focus-visible,
.meadow-sound:focus-visible,
.meadow-break:focus-visible {
  outline: 2px solid var(--hero-ink);
  outline-offset: 2px;
  border-radius: 999px;
}
@keyframes pill-in {
  from {
    opacity: 0;
    translate: 0 -8px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .dock,
  .dock__pebble,
  .pagebar,
  .meadow-hero,
  .meadow-controls,
  .meadow-fallback,
  .hand-cursor svg {
    transition: none !important;
  }
  .break-pill,
  .meadow-welcome,
  .backdrop__star {
    animation: none !important;
  }
}
.hand-cursor svg {
  display: block;
  overflow: visible;
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.28));
  transition: transform 120ms var(--ease);
  transform-origin: 50% 90%;
}
.hand-cursor[data-down='true'] svg {
  transform: scale(0.9) rotate(-6deg);
}

/* Refresh spins while it fetches the newest files. */
.refresh-btn[data-busy='true'] svg {
  animation: refresh-spin 0.8s linear infinite;
}
@keyframes refresh-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .refresh-btn[data-busy='true'] svg {
    animation: none;
  }
}

/* "Add" monogram tile on Websites. */
.mono--add {
  background: var(--surface-2);
  color: var(--text-2);
}

/* ---------- Tasks ---------- */
.focus .task-list {
  margin: 0 -8px;
}
.panel--flush .task-list,
.panel--flush .add-row {
  padding: 0 10px;
}
.task {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 8px 10px 10px;
  border-radius: var(--r-md);
  animation: row-in var(--t-med) var(--ease);
  transition: background var(--t-fast);
}
.task:hover {
  background: var(--surface-2);
}
.task .tcheck {
  margin-top: 1px;
}
.task__meta-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.task__meta-item.is-overdue {
  color: var(--danger);
}
.task:hover .task__label {
  background: var(--surface-3);
}
.task__menu {
  opacity: 0;
  transition: opacity var(--t-fast);
}
.task:hover .task__menu,
.task:focus-within .task__menu {
  opacity: 1;
}
.task-group__title {
  padding: 12px 20px 4px;
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-2);
}
.task-group__title.is-danger {
  color: var(--danger);
}
.panel--flush > .add-row {
  margin: 0 10px;
  padding: 0 8px 0 10px;
}
.add-row__icon {
  color: var(--accent-text);
  margin: 0 2px;
  flex: none;
}

/* ---------- Goals ---------- */
.goal {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px 18px 14px 20px;
}
.goal__due.is-danger {
  color: var(--danger);
}
.goal__due.is-warn {
  color: var(--warn);
}

/* ---------- Knowledge ---------- */
.notes {
  display: grid;
  grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.notes__list {
  position: sticky;
  top: 76px;
  max-height: calc(100vh - 110px);
  display: flex;
  flex-direction: column;
  padding: 8px;
}
.notes__search,
.search-field {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 4px 0 10px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  flex: none;
}
.notes__search-input,
.search-field input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  outline: none;
  height: 100%;
  font-size: var(--fs-md);
}
.notes__search:focus-within,
.search-field:focus-within {
  box-shadow: 0 0 0 2px var(--accent);
}
.notes__editor {
  min-height: 420px;
  padding: 14px 28px 28px;
}

/* ---------- Saved rows ---------- */
.rows {
  list-style: none;
  margin: 0;
  padding: 0 10px;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 6px 10px 10px;
  border-radius: var(--r-md);
  transition: background var(--t-fast);
  animation: row-in var(--t-med) var(--ease);
}
.row:hover {
  background: var(--surface-2);
}
.row + .row {
  box-shadow: 0 -1px 0 var(--border);
}
.row:hover,
.row:hover + .row {
  box-shadow: none;
}
.row__ext {
  display: inline;
  vertical-align: -1px;
  margin-left: 4px;
  color: var(--text-3);
  opacity: 0;
  transition: opacity var(--t-fast);
}
.row:hover .row__ext {
  opacity: 1;
}

/* ---------- Launchpad ---------- */
.launch-tile__inner {
  height: 100%;
  min-height: 148px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 16px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface);
  text-align: left;
  width: 100%;
  transition: border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
}
a.launch-tile__inner:hover,
.launch-tile__inner--add:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.launch-tile__inner .mono {
  margin-bottom: 10px;
}
.launch-tile__inner--add {
  border-style: dashed;
  background: transparent;
  color: var(--text-2);
  justify-content: center;
  align-items: center;
}
.launch-tile__inner--add .mono {
  margin-bottom: 6px;
}
.is-arranging .launch-tile__inner--arrange {
  cursor: grab;
  border-style: dashed;
  border-color: var(--border-strong);
}
.launch-tile__grip {
  position: absolute;
  top: 14px;
  right: 12px;
  color: var(--text-3);
}
.launch-tile__arrows {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: auto;
}
.launch-tile__pos {
  min-width: 18px;
  text-align: center;
  font-size: var(--fs-xs);
  color: var(--text-3);
}
.launch-tile.is-dragging {
  opacity: 0.4;
}
.launch-tile.is-over .launch-tile__inner {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.is-arranging .launch-tile {
  animation: wiggle-in var(--t-med) var(--ease);
}
@keyframes wiggle-in {
  50% {
    transform: rotate(-0.6deg);
  }
}

/* ---------- Settings ---------- */
.settings {
  display: grid;
  gap: 16px;
  max-width: 760px;
}
.settings__section {
  display: grid;
  gap: 4px;
  padding: 18px 22px;
}
.settings__note {
  font-size: var(--fs-sm);
  color: var(--text);
  max-width: 62ch;
}
.settings__note.muted {
  color: var(--text-2);
}
.settings__label p {
  font-weight: 500;
}
.settings__label span {
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.settings__control .field {
  width: 100%;
}
.keys {
  list-style: none;
  margin: 4px 0 6px;
  padding: 0;
  display: grid;
}
.keys li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-top: 1px solid var(--border);
  font-size: var(--fs-md);
  flex-wrap: wrap;
}
.keys li:first-child {
  border-top: 0;
}
.keys li > span:last-child {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--text-2);
  font-size: var(--fs-sm);
}

/* ---------- Quick capture ---------- */
.capture {
  display: grid;
  gap: 4px;
  margin: -4px -4px -8px;
}
.capture__kinds {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}
.capture__kind {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 11px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.capture__kind:hover {
  background: var(--surface-2);
  color: var(--text);
}
.capture__kind[aria-checked='true'] {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.capture__input {
  width: 100%;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  font-size: var(--fs-xl);
  line-height: 1.45;
  padding: 8px 4px;
  min-height: 44px;
}
.capture__input::placeholder {
  color: var(--text-3);
}
.capture__error {
  font-size: var(--fs-sm);
  color: var(--danger);
  padding: 0 4px;
}
.capture__foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 10px;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.capture__hint {
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.capture__keys {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  color: var(--text-3);
}
@media (max-width: 640px) {
  .capture__keys {
    display: none;
  }
  .capture__foot .btn {
    margin-left: auto;
  }
}

/* ---------- Search palette ---------- */
.palette {
  display: flex;
  flex-direction: column;
  margin: -12px -20px -20px;
  max-height: 64vh;
}
.palette__input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px 0 18px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  flex: none;
}
.palette__input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  font-size: var(--fs-lg);
  height: 100%;
}
.palette__input::placeholder {
  color: var(--text-3);
}
.palette__list {
  overflow-y: auto;
  padding: 6px 8px 8px;
  flex: 1;
}
.palette__group {
  padding: 10px 10px 4px;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.palette__item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 40px;
  padding: 0 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  min-width: 0;
}
.palette__item[aria-selected='true'] {
  background: var(--accent-soft);
}
.palette__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  color: var(--text-2);
}
.palette__item[aria-selected='true'] .palette__icon {
  color: var(--accent-text);
}
.palette__title {
  font-size: var(--fs-md);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.palette__meta {
  flex: 1;
  min-width: 0;
  font-size: var(--fs-sm);
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.palette__enter {
  flex: none;
  color: var(--accent-text);
  display: grid;
  margin-left: auto;
}
.palette__empty {
  display: grid;
  gap: 8px;
  justify-items: start;
  padding: 16px 10px;
  color: var(--text-2);
}
.palette__foot {
  display: flex;
  gap: 16px;
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  font-size: var(--fs-xs);
  color: var(--text-3);
  background: var(--bg);
  flex: none;
}
.palette__foot span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  .notes {
    grid-template-columns: minmax(0, 1fr);
  }
  .notes__editor {
    padding: 10px 18px 24px;
    min-height: 60vh;
  }
  .row__tags .badge:not(.badge--sample) {
    display: none;
  }
  .toolbar > .segmented {
    width: 100%;
  }
  .settings__section {
    padding: 16px;
  }
  .panel {
    padding: 16px;
  }
  .panel--flush {
    padding: 6px 0;
  }
  .panel--flush .task-list,
  .rows {
    padding: 0 4px;
  }
}

@media (max-width: 760px) {
  .toolbar > .segmented button {
    flex: 1;
    justify-content: center;
    padding: 0 8px;
  }
  .toolbar > .segmented button svg {
    display: none;
  }
}

/* ---------- Task progress (my own %) ---------- */
.tprog {
  position: relative;
  flex: none;
  align-self: center;
}
.tprog__btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 8px;
  border-radius: var(--r-sm);
  color: var(--text-2);
  font-size: var(--fs-xs);
  transition: background var(--t-fast), color var(--t-fast);
}
.tprog__btn:hover,
.tprog.is-open .tprog__btn {
  background: var(--surface-3);
  color: var(--text);
}
.task:hover .tprog__bar {
  background: var(--border-strong);
}
.tprog__btn.is-full .tprog__fill {
  background: var(--success);
}
.input.tprog__num {
  width: 64px;
  height: 30px;
  padding: 0 8px;
  text-align: right;
}
.tprog__quick .chip {
  flex: 1;
  justify-content: center;
  padding: 0 4px;
}

/* ---------- Category color swatches ---------- */
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.swatch {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff 0%, #fff 30%, var(--sw) 100%);
  border: 2px solid var(--sw);
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.swatch:hover {
  transform: scale(1.08);
}
.swatch[aria-checked='true'] {
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sw);
}

/* ---------- Ideas ---------- */
.ideas {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.ideas-side__card {
  display: grid;
  gap: 10px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.ideas-side__card > .btn {
  justify-self: start;
}
.ideas-side__icon {
  flex: none;
  color: var(--warn);
}

.igraph {
  position: relative;
  height: clamp(440px, 70vh, 740px);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: radial-gradient(ellipse at 50% 20%, var(--surface) 0%, var(--surface-2) 100%);
  overflow: hidden;
}
.igraph__edge.is-dim {
  stroke-opacity: 0.15;
}
.igraph__edge.is-active {
  stroke: var(--text-2);
  stroke-opacity: 1;
  stroke-width: 1.6;
}
.igraph__pos.is-dim {
  opacity: 0.3;
}
.igraph__node:hover .igraph__dot {
  stroke-width: 3;
  filter: brightness(1.06);
}
.igraph__node:focus-visible .igraph__dot {
  stroke: var(--accent);
  stroke-width: 3.5;
}
.igraph__node.is-selected .igraph__dot {
  stroke-width: 3.5;
}
.igraph__controls .icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
@keyframes ig-pop {
  from {
    opacity: 0;
    transform: scale(0.3);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes ig-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@media (max-width: 900px) {
  .ideas {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- Sync ---------- */
.sync-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.sync-line.is-error {
  color: var(--danger);
}
@keyframes sync-pulse {
  to {
    opacity: 0.3;
  }
}
.pair-code__digits.is-expired {
  color: var(--text-3);
  text-decoration: line-through;
}
.input.code-input {
  height: 52px;
  font-family: var(--mono);
  font-size: 26px;
  letter-spacing: 0.3em;
  text-align: center;
}

/* ---------- Lock screen ---------- */
.lock {
  position: fixed;
  inset: 0;
  z-index: 45;
  display: grid;
  place-items: center;
  padding: 24px 16px max(24px, env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  animation: fade-in var(--t-med) var(--ease);
}
.lock__box {
  display: grid;
  justify-items: center;
  gap: 8px;
  width: 100%;
  max-width: 300px;
}
.lock__title {
  margin-top: 10px;
  font-size: var(--fs-2xl);
  letter-spacing: -0.02em;
}
.lock__sub {
  color: var(--text-2);

@keyframes sprout-pop {

  70% {

  }
  100% {

/* Websites: tiles float up like clouds. */

/* Ideas: round seeds joined by soft vines. */

/* Saved: a petal tucked into each card's corner. */
main[data-section='saved'] .panel {
  position: relative;
}
main[data-section='saved'] .panel::after {
  content: '';
  position: absolute;
  top: -1px;
